
name: OMNIX APK Derlemesi

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK yolunu bul ve kur
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı"
            find "$SDK_ROOT" -maxdepth 4 -type d
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: OMNIX ZIP dosyasını aç
        run: |
          unzip -q OMNIX_GitHub_Hazir.zip -d source
          ls -la source/OMNIX

      - name: APK oluştur
        run: |
          cd source/OMNIX
          gradle --no-daemon --stacktrace assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OMNIX-APK
          path: source/OMNIX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
