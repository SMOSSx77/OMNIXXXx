
name: OMNIX APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q OMNIX_GitHub_Hazir.zip -d source
          echo "Project files:"
          ls -la source
          test -f source/settings.gradle
          test -f source/app/build.gradle

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "SDK ROOT: $SDK_ROOT"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o android-tools.zip

          mkdir -p android-tools
          unzip -q android-tools.zip -d android-tools

          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -r android-tools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build OMNIX APK
        run: |
          gradle --no-daemon --stacktrace \
            -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMNIX-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
